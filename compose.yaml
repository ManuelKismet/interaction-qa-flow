services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: smart_qa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_qa"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - smart_qa_postgres:/var/lib/postgresql/data

volumes:
  smart_qa_postgres: