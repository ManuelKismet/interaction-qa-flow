name: NIA foundation validation
on:
  pull_request:
    paths:
      - 'packages/nopak_nia/**'
      - 'apps/flutter_app/**'
      - '.github/workflows/nia-validation.yml'
permissions:
  contents: read
jobs:
  nia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed ../../packages/nopak_nia/lib lib/core/nia test/nia_foundation_test.dart test/nia_guidance_widget_test.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --no-pub --reporter expanded
