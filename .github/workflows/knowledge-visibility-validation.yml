name: Knowledge visibility validation
on:
  pull_request:
    paths:
      - 'backend/app/services/permissions.py'
      - 'backend/app/models/question.py'
      - 'backend/alembic/versions/0016_knowledge_team_visibility.py'
      - 'backend/tests/test*visibility*'
      - 'apps/flutter_app/lib/features/questions/**'
      - 'apps/flutter_app/lib/features/ask/**'
      - 'apps/flutter_app/test/ask_page_test.dart'
      - 'apps/flutter_app/test/question*test.dart'
      - '.github/workflows/knowledge-visibility-validation.yml'
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/features/questions lib/features/ask/application/ask_controller.dart lib/features/ask/presentation/ask_page.dart test/ask_page_test.dart test/question_detail_page_test.dart test/questions_repository_test.dart
      - run: flutter analyze lib/features/questions lib/features/ask/application/ask_controller.dart lib/features/ask/presentation/ask_page.dart
      - run: flutter test test/ask_page_test.dart test/question_detail_page_test.dart test/questions_repository_test.dart test/question_models_test.dart test/unified_search_results_test.dart
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visibility_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/visibility_test
      KNOWLEDGE_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/visibility_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: alembic upgrade 0015
      - run: alembic upgrade head
      - run: python -m pytest tests/test_knowledge_visibility_postgresql.py -q
      - run: alembic downgrade 0015
      - name: Confirm rollback retains restricted rows
        run: |
          python - <<'PY'
          import asyncio, os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          async def check():
              engine = create_async_engine(os.environ['DATABASE_URL'])
              async with engine.connect() as connection:
                  for table, column in [('questions', 'visibility'), ('question_versions', 'visibility_snapshot')]:
                      assert await connection.scalar(text(f"SELECT count(*) FROM {table} WHERE {column}::text = 'team'")) > 0
              await engine.dispose()
          asyncio.run(check())
          PY
      - run: alembic upgrade head
