name: Knowledge proposal concurrency validation
on:
  pull_request:
    paths:
      - 'backend/app/services/guided_knowledge.py'
      - 'backend/app/schemas/guided.py'
      - 'backend/tests/test_guided_postgresql.py'
      - '.github/workflows/knowledge-proposal-validation.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proposal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      ORGANISATION_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/proposal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest tests/test_guided_postgresql.py::test_postgres_concurrent_knowledge_submissions_share_pending_proposal -q
