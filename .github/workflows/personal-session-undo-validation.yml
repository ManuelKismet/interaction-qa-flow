name: Personal session Undo validation
on:
  pull_request:
    paths:
      - 'apps/flutter_app/lib/features/guest/presentation/guest_workspace_page.dart'
      - 'apps/flutter_app/test/account_state_widget_test.dart'
      - '.github/workflows/personal-session-undo-validation.yml'
permissions:
  contents: read
jobs:
  personal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/features/guest/presentation/guest_workspace_page.dart test/account_state_widget_test.dart
      - run: flutter test test/account_state_widget_test.dart test/guest_interact_widget_test.dart test/guest_workspace_store_test.dart
