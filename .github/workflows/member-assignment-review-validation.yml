name: Member assignment review validation
on:
  pull_request:
    paths:
      - 'backend/app/services/organisation_member.py'
      - 'backend/app/services/governance.py'
      - 'backend/app/schemas/organisation_member.py'
      - 'backend/tests/test_member_assignment_review*'
      - 'apps/flutter_app/lib/features/admin/presentation/admin_page.dart'
      - 'apps/flutter_app/lib/features/governance/data/governance_repository.dart'
      - 'apps/flutter_app/test/team_ui_test.dart'
      - 'apps/flutter_app/test/member_assignment_repository_test.dart'
      - '.github/workflows/member-assignment-review-validation.yml'
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/features/admin/presentation/admin_page.dart lib/features/governance/data/governance_repository.dart test/team_ui_test.dart test/member_assignment_repository_test.dart
      - run: flutter analyze lib/features/admin/presentation/admin_page.dart lib/features/governance/data/governance_repository.dart test/team_ui_test.dart test/member_assignment_repository_test.dart
      - run: flutter test test/team_ui_test.dart test/member_assignment_repository_test.dart test/organisation_page_test.dart test/organisation_scope_test.dart test/responsive_organisation_test.dart
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assignment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      ORGANISATION_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/assignment_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest tests/test_member_assignment_review_postgresql.py -q
