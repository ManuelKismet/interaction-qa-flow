name: Invitation preview validation
on:
  pull_request:
    paths:
      - 'apps/flutter_app/lib/features/guest/data/guest_group_repository.dart'
      - 'apps/flutter_app/lib/features/guest/presentation/guest_workspace_page.dart'
      - 'apps/flutter_app/test/guest_group_dialog_test.dart'
      - '.github/workflows/invitation-preview-validation.yml'
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/features/guest/data/guest_group_repository.dart lib/features/guest/presentation/guest_workspace_page.dart test/guest_group_dialog_test.dart test/guest_group_repository_test.dart
      - run: flutter test test/guest_group_dialog_test.dart
