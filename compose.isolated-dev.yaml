# Standalone file: use -f compose.isolated-dev.yaml; do not merge with compose.yaml.
name: intqaflow-isolated-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: intqaflow_dev
      POSTGRES_USER: intqaflow_dev
      POSTGRES_PASSWORD: local_synthetic_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intqaflow_dev -d intqaflow_dev"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - isolated_postgres:/var/lib/postgresql/data
volumes:
  isolated_postgres:
